# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "finite-integral-ra"
  description: "Classification of finite integral relation algebras."          # mathematical content and principal results
  authors: ["Chris Henson"]
  responsible_maintainers: ["Chris Henson"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "CSLib: Cslib/Foundations/RelationAlgebra/IntegralAtomStructure.lean"
    authors: ["Chris Henson"]
    id: "https://github.com/leanprover/cslib/blob/910210f7d155e22a2244591e394bd16fbb0ddbb3/Cslib/Foundations/RelationAlgebra/IntegralAtomStructure.lean"
    type: "formal library"
    location: "theorem_wanted statements in namespace IsoClass"
    relationship: "formalizes"
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: "Small relation algebras: list of small integral relation algebras"
    authors: ["Peter Jipsen"]
    contributors:
      - name: "Roger Maddux"
        role: "author cited in table"
    id: "https://www1.chapman.edu/~jipsen/gap/ramaddux.html"
    type: "web page"
    location: "table of counts by type <1,s,n>, rows with 1 + s + 2n <= 7"
    relationship: "independently-proves"
  - title: "Introduction to Relation Algebras: Relation Algebras, Volume 1"
    authors: ["Steven Givant"]
    id: "doi:10.1007/978-3-319-65235-1"
    type: "book"
    location: "Section 4.2"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Advanced Topics in Relation Algebras: Relation Algebras, Volume 2"
    authors: ["Steven Givant"]
    id: "doi:10.1007/978-3-319-65945-9"
    type: "book"
    location: "Section 19.3"
    relationship: "background"
    author_endorsement: "n/a"

# related_formalizations - prior or parallel formalizations, if known.
related_formalizations: []

# classification - arXiv taxonomy and MSC2020 identifiers.
