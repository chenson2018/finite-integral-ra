# how it was produced
automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5-2"]
      framework: "Claude Code"
      cost:
        wall_time: "~11.5 active hours"
        spend_usd: "about $175 at API list prices (estimate: 242M tokens, 1.87M output)"
        hardware: "AMD Ryzen AI 5 PRO 340 laptop (6 cores / 12 threads), 86 GiB RAM"
  spend_usd: "about $198 at API list prices including post-proof cleanup"

# review status
review:
  status: "definitions reviewed in cslib, passing Comparator"
  reviewers: ["Thomas Waring"]
  notes: "Definitions and statements were closely reviewed in cslib pull requests."

# alignment - how source statements map to formal declarations.
alignment:
  namespace: "Cslib.RelationAlgebra.IntegralAtom.IsoClass"
  statements:
    - source: "Jipsen's table, rows <1,s,n> with 1 + s + 2n <= 7"
      lean: "card_ofSymmNsymm_<s>_<n>"
      module: "Solution/Atoms<k>/Symm<s>Nsymm<n>.lean"
      status: "proved"
    - source: "Totals for k = 1..7 atoms (sums of Jipsen's rows)"
      lean: "card_ofAtoms_*"
      module: "Solution/Atoms<k>/Total.lean"
      status: "proved"
    - source: "Jipsen's table, row <1,1,3> (8 atoms)"
      lean: "card_ofSymmNsymm_one_three (CSLib theorem_wanted)"
      status: "not-formalized"
